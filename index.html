<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speed Shift | منتجات ذكية لحياة أسهل</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #222;
            line-height: 1.7;
        }

        header {
            background: #222;
            color: white;
            padding: 18px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 28px;
            letter-spacing: 1px;
        }

        header p {
            color: #d4af37;
            font-size: 14px;
        }

        .hero {
            text-align: center;
            padding: 50px 20px;
            background: white;
        }

        .hero h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .hero p {
            color: #666;
            font-size: 17px;
        }

        .products {
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }

        .products h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .product-card {
            background: white;
            max-width: 350px;
            margin: auto;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .product-image {
            height: 250px;
            background: #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }

        .product-info {
            padding: 20px;
            text-align: center;
        }

        .product-info h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }

        .price {
            font-size: 25px;
            font-weight: bold;
            color: #d4af37;
            margin: 10px 0;
        }

        .order-btn {
            display: block;
            width: 100%;
            border: none;
            background: #222;
            color: white;
            padding: 13px;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 15px;
        }

        .order-btn:hover {
            background: #d4af37;
            color: #222;
        }

        footer {
            margin-top: 50px;
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Speed Shift</h1>
        <p>منتجات مختارة لحياة أسهل وأذكى</p>
    </header>

    <section class="hero">
        <h2>اختار المنتج المناسب ليك</h2>
        <p>منتجات عملية بجودة ممتازة وأسعار منافسة</p>
    </section>

    <section class="products">

        <h2>منتجاتنا</h2>

        <div class="product-card">

            <div class="product-image">
                صورة المنتج
            </div>

            <div class="product-info">

                <h3>منتج Speed Shift</h3>

                <p>
                    تفاصيل المنتج هتظهر هنا
                </p>

                <div class="price">
                    599 جنيه
                </div>

                <button class="order-btn">
                    اطلب الآن
                </button>

            </div>

        </div>

    </section>

    <footer>
        © 2026 Speed Shift - جميع الحقوق محفوظة
    </footer>

</body>
</html>
