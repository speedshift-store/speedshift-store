<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speed Shift</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="./logo.png" alt="Speed Shift" class="logo">
        <p>منتجات مختارة لحياة أسهل وأذكى</p>
    </header>

    <main>
        <section class="hero">
            <h2>اختار المنتج المناسب ليك</h2>
            <p>منتجات عملية بجودة ممتازة وأسعار منافسة</p>
        </section>

        <section class="products">
            <h2>منتجاتنا</h2>

            <div class="product-card">
                <div class="product-image">
                    صورة المنتج
                </div>

                <div class="product-info">
                    <h3>منتج Speed Shift</h3>
                    <p>تفاصيل المنتج هتظهر هنا</p>
                    <div class="price">599 جنيه</div>

                    <button onclick="orderProduct()">
                        اطلب الآن
                    </button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        © 2026 Speed Shift - جميع الحقوق محفوظة
    </footer>

    <script src="script.js"></script>
</body>
</html>
